# Generated from security.config.js — do not edit by hand.
# include this file from your server{} block.

add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-8RcXZFJLHqoJ0sOOm7hZNzJF02Iaj2ylAL0VOieh2FI='; style-src 'self'; style-src-elem 'self' 'unsafe-inline'; style-src-attr 'none'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'none'; form-action 'self'; frame-src https://www.youtube-nocookie.com; manifest-src 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "cross-origin" always;
add_header X-Frame-Options "DENY" always;

# SPA fallback. /api/ is excluded: it is proxied to the function runtime.
location / {
  try_files $uri $uri/ /index.html;
}
location /assets/ {
  add_header Cache-Control "public, max-age=31536000, immutable" always;
}
location = /index.html {
  add_header Cache-Control "no-cache" always;
}
location /api/ {
  add_header Cache-Control "no-store, max-age=0" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
}
